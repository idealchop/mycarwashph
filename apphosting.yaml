# App Hosting config shared by both backends (mycarwash-dev, mycarwash-prod) of
# Firebase project `mycarwashph`. Per-environment values live in
# apphosting.dev.yaml / apphosting.prod.yaml, selected by each backend's
# Environment name (dev / prod). No secrets here.
#
# The Firebase web config is NOT listed here: App Hosting injects
# FIREBASE_WEBAPP_CONFIG at build time for the linked web app ("Mycarwash PH Web")
# and frontend/next.config.ts maps it to NEXT_PUBLIC_FIREBASE_*.

# pnpm monorepo: build the vendored UI kit, then the Next.js app in frontend/.
scripts:
  buildCommand: pnpm build:packages && pnpm --filter @mycarwash/web build
  runCommand: pnpm --filter @mycarwash/web start

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_USE_EMULATORS
    value: "false"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
    availability: [BUILD, RUNTIME]
