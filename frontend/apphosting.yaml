# App Hosting config shared by both backends (mycarwash-dev, mycarwash-prod) of
# Firebase project `mycarwashph`. Per-environment values live in
# frontend/apphosting.dev.yaml / apphosting.prod.yaml, selected by each backend's
# Environment name (dev / prod). No secrets here.
#
# The Firebase web config is NOT listed here: App Hosting injects
# FIREBASE_WEBAPP_CONFIG at build time for the linked web app ("Mycarwash PH Web")
# and frontend/next.config.ts maps it to NEXT_PUBLIC_FIREBASE_*.

# pnpm monorepo deployed with App Hosting's Turborepo support: the backend root
# directory is `frontend` (firebase.json), and the buildpack runs
# `turbo run build --filter=@mycarwash/web`, which builds the vendored UI kit
# packages first (turbo.json dependsOn ^build) and then `next build` through the
# App Hosting Next.js adapter (standalone output).

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_USE_EMULATORS
    value: "false"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
    availability: [BUILD, RUNTIME]
