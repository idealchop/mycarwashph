# Environment "prod" (backend mycarwash-prod): Firestore database mycarwash-prod
# through the private mycarwashApiProd function, reached via the /api proxy.
runConfig:
  minInstances: 0
  maxInstances: 4
env:
  - variable: NEXT_PUBLIC_APP_ENV
    value: prod
    availability: [BUILD, RUNTIME]
  # Browser calls same-origin /api/*; the Next.js server forwards to this private
  # Cloud Run URL with the backend service account's ID token (runtime only).
  - variable: API_UPSTREAM_URL
    value: https://mycarwashapiprod-o4uz6gedqa-as.a.run.app
    availability: [RUNTIME]
